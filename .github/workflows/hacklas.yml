name: "Deploy to Hacklas"

on:
  push:
    branches: ["hacklas"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: |
          npm ci
          npm run setheapsize

      - name: Production Build
        if: success()
        run: npx grunt prod --msg=""

      - name: Generate sitemap
        run: npx grunt exec:sitemap

      - name: Prepare for GitHub Pages
        if: success() && matrix.node-version == 24
        run: npx grunt copy:ghPages

      # - name: Deploy to GitHub Pages
      #   if: success() && github.ref == 'refs/heads/master' && matrix.node-version == 24
      #   uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
      #   with:
      #     target_branch: gh-pages
      #     build_dir: ./build/prod
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/hacklas'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/prod

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/hacklas'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
