name: "Master Build, Test & Deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - hacklas # hacklas is master

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: |
          npm ci
          npm run setheapsize

      - name: Lint
        run: npx grunt lint

      - name: Unit Tests
        run: |
          npm test
          npm run testnodeconsumer

      - name: Production Build
        if: success()
        run: npx grunt prod --msg=""

      - name: Generate sitemap
        run: npx grunt exec:sitemap

      - name: Setup Chrome
        id: setup-chrome
        if: success()
        uses: ./.github/actions/setup-chrome

      - name: UI Tests
        if: success()
        run: |
          sudo apt-get install xvfb
          xvfb-run --server-args="-screen 0 1200x800x24" npx grunt testui

      - name: Prepare for GitHub Pages
        if: success()
        run: npx grunt copy:ghPages

      # - name: Deploy to GitHub Pages
      #   if: success() && github.ref == 'refs/heads/hacklas'
      #   uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
      #   with:
      #     target_branch: gh-pages
      #     build_dir: ./build/prod
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/hacklas'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/prod

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

